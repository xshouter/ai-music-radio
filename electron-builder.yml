# 打包配置。产物里**不含任何凭证**：key / cookie 一律由使用者在 LOGIN 弹窗里填，落在用户数据目录。
appId: dev.edgerunner.app
productName: EdgeRunner
directories:
  output: release
files:
  - electron/main.cjs
  - electron/preload.cjs
  - package.json
# UI 放到 asar 外面，交给内核的静态文件服务去读（core/server.ts 用 createReadStream）。
extraResources:
  - from: renderer/dist
    to: ui
  # 离线嗓子：piper 运行时 + 语音模型。放 asar 外面，因为它是**要被 spawn 的进程**，
  # 而且 piper 用 fopen 读自己的 espeak-ng-data（非 ASCII 路径会崩，见 main/tts-runtime.ts）。
  - from: vendor/piper
    to: piper
  # 内置的音乐源（约 27MB）：它和 piper 一样是**要被 spawn 的进程**，所以也放 asar 外面。
  # 目标只有一个：双击 exe 就能用，用户不必自己去起第二个进程（ADR-0028）。
  - from: vendor/netease
    to: netease
  # 内置服务的 node_modules 必须**单独再搬一次**：electron-builder 对 extraResources 会
  # 无条件丢掉源目录**顶层**的 node_modules（app-builder-lib/out/util/filter.js 里
  # relative === 'node_modules' 就直接 return false，早于用户写的 filter 生效）。
  # 少了这条，resources/netease 里只剩 package.json / package-lock.json 两个文件，
  # 「双击 exe 就能用」在音乐源这一环会静默断掉。落到 netease/node_modules 正是 core 期望的形状。
  - from: vendor/netease/node_modules
    to: netease/node_modules
  # 首次体验的两件东西（约 3MB）：随包的一首歌 + 它那段冻结的口播（ADR-0033）。
  - from: assets/demo
    to: demo
win:
  # 应用图标：与界面同源的点阵播放三角（tools/make-icon.mjs 生成，含 7 个尺寸）。
  icon: assets/icon.ico
  # 只要 portable：打开即用的单文件 exe 是主交付物，v1 不做安装包（ADR-0023）。
  target:
    - portable
# 打开即用：一个 exe，双击就跑，不装任何东西 —— 这是主交付物。
portable:
  artifactName: EdgeRunner-${version}-portable.${ext}
# 这里**没有** publish 配置，是故意的：出包只负责出包，发布交给工作流用 `gh` 明确地做
# （.github/workflows/release.yml）。electron-builder 自带的 GitHub publisher 在同一次运行里
# 会为同一个 tag 建出**两个** draft Release（v0.1.0 上实测过），不如自己来。