# 打包配置。产物里**不含任何凭证**：key / cookie 一律由使用者在 LOGIN 弹窗里填，落在用户数据目录。
appId: dev.edgerunner.app
productName: EdgeRunner
directories:
  output: release
files:
  - electron/main.cjs
  - electron/preload.cjs
  - package.json
# UI 放到 asar 外面，交给内核的静态文件服务去读（core/server.ts 用 createReadStream）。
extraResources:
  - from: renderer/dist
    to: ui
win:
  target: nsis
  artifactName: EdgeRunner-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
# 这里**没有** publish 配置，是故意的：出包只负责出包，发布交给工作流用 `gh` 明确地做
# （.github/workflows/release.yml）。electron-builder 自带的 GitHub publisher 在同一次运行里
# 会为同一个 tag 建出**两个** draft Release（v0.1.0 上实测过），不如自己来。